name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        pip install codespell flake8 isort yapf
    - name: Lint
      run: |
        codespell
        flake8 .
        isort --check-only --diff gfpgan/ scripts/ inference_gfpgan.py setup.py tests/
        yapf -r -d gfpgan/ scripts/ inference_gfpgan.py setup.py tests/
