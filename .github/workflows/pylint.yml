name: Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install lint tools
      # pinned: yapf's formatting output differs between versions, and the
      # check-only steps must match the formatting committed to the repo
      run: |
        python -m pip install --upgrade pip
        pip install codespell==2.4.3 flake8==7.5.0 isort==9.0.2 yapf==0.43.0
    - name: Lint
      run: |
        codespell
        flake8 .
        isort --check-only --diff gfpgan/cli.py gfpgan/models/gfpgan_model.py tests/test_compat.py tests/test_model_registry.py
        yapf -r -d gfpgan/cli.py gfpgan/models/gfpgan_model.py tests/test_compat.py tests/test_model_registry.py
