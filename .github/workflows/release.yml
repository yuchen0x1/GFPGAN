name: GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ['RELEASE_TAG']
          if not tag.startswith('v'):
              raise SystemExit(f'Expected a v-prefixed tag, got {tag!r}')

          tag_version = tag[1:]
          project_version = tomllib.loads(
              pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          version_file = pathlib.Path('VERSION').read_text(encoding='utf-8').strip()

          versions = {
              'tag': tag_version,
              'pyproject.toml': project_version,
              'VERSION': version_file,
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f'Version mismatch: {versions}')

          print(f'Releasing GFPGAN {tag_version}')
          PY

      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Store build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

      - name: Create GitHub Release and upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$REPOSITORY" \
              --title "GFPGAN $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
