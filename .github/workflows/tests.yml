name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # basicsr 1.4.2 ships an sdist only, and its setup.py is incompatible
        # with Python 3.13 (PEP 667 exec-locals change), so 3.13 cannot
        # install basicsr until upstream fixes it.
        python-version: ['3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        # basicsr still declares tb-nightly, which is unavailable on some
        # Python versions: install its real runtime deps manually, then
        # install basicsr/facexlib/realesrgan without resolving deps.
        pip install addict future lmdb opencv-python-headless pyyaml scipy tensorboard tqdm yapf requests scikit-image imageio tifffile lazy-loader packaging
        pip install basicsr==1.4.2 facexlib==0.3.0 realesrgan==0.3.0 --no-deps
        pip install pytest
    - name: Run tests
      # the whole suite runs on CPU; test_utils skips itself (no pretrained
      # models on CI) and test_gfpgan_model falls back to num_gpu: 0
      run: pytest tests/
